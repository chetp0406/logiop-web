    font-size: 13px;
    font-family: Consolas;
}
.fsm-transition-themelight {
    stroke: var(--t-stroke);
    stroke-width: var(--t-stroke-width);
    fill: none;
}
.fsm-transition-guard-themelight {
    fill: var(--text-color);
    font-size: 13px;
    font-family: Consolas;
}

.fsm-transition-action-themelight {
